# cargo-deny policy: run with `cargo deny check`.
# Licences are checked per crate against the SPDX expression it declares. A crate that offers
# an alternative (for example "MIT OR LGPL-2.1-or-later") passes through the permissive branch.

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate notices (no known vulnerability). All are transitive through the GUI stack
# (egui/winit/zbus) and are revisited whenever those dependencies are updated.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained notice only, transitive" },
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained notice only, transitive" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained notice only, transitive" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained notice only, transitive" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained notice only, transitive" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained notice only, transitive" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained notice only, transitive" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]

# epaint bundles font files under their own licences (SIL OFL-1.1 and the Ubuntu Font Licence 1.0).
# They are acceptable for redistribution but each needs its notice in THIRD_PARTY_NOTICES.
exceptions = [
    { crate = "epaint", allow = ["OFL-1.1", "LicenseRef-UFL-1.0"] },
]

[bans]
multiple-versions = "warn"
# Workspace members depend on each other by path; cargo-deny reports those as wildcards.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
