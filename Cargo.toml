[workspace]
resolver = "2"
members = [
    "crates/asterion-core",
    "crates/asterion-geom",
    "crates/asterion-bim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Asterion-OpenDesign/Asterion-bim"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
asterion-core = { path = "crates/asterion-core" }
asterion-geom = { path = "crates/asterion-geom" }
asterion-bim = { path = "crates/asterion-bim" }
